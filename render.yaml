services:
  - type: web
    name: nexora
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/nexora.sqlite
    disk:
      name: nexora-data
      mountPath: /var/data
      sizeGB: 1
